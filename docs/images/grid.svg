<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Grade de miniaturas de fotos no painel: seis cartas numeradas, uma destacada com ações de editar e excluir, e um botão de enviar fotos.">
