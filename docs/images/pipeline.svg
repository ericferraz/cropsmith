<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Fluxo da Cropsmith: imagem original vai para o editor React (recorte, zoom, rotação), é exportada como Blob e processada pelo Sharp no Node, gerando derivadas WebP enquanto o original é preservado.">
  <rect width="960" height="420" rx="18" fill="#f3ecdd"/>
  <text x="40" y="52" font-size="20" font-weight="600" fill="#1a1a1a">Como a Cropsmith trata a imagem</text>
  <text x="40" y="78" font-size="14" fill="#1a1a1a" opacity=".6">Cliente (React) enquadra · Servidor (Sharp) otimiza · original sempre preservado</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e5251f"/>
    </marker>
  </defs>

  <g>
    <rect x="40" y="120" width="150" height="190" rx="12" fill="#17110e"/>
    <rect x="58" y="138" width="60" height="6" rx="3" fill="#e5251f"/>
    <text x="115" y="225" text-anchor="middle" font-size="13" fill="#fff" font-weight="500">Original</text>
    <text x="115" y="245" text-anchor="middle" font-size="10" letter-spacing="2" fill="#e5a08f">SÁB 24/01</text>
    <rect x="40" y="320" width="150" height="26" rx="8" fill="#1f9d52"/><text x="115" y="338" text-anchor="middle" font-size="12" fill="#fff">preservado</text>
  </g>

  <line x1="198" y1="215" x2="248" y2="215" stroke="#e5251f" stroke-width="2.5" marker-end="url(#ar)"/>

  <g>
    <rect x="256" y="120" width="186" height="190" rx="12" fill="#fff" stroke="#00000018"/>
    <text x="349" y="150" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">ImageEditor</text>
    <text x="349" y="168" text-anchor="middle" font-size="11" fill="#1a1a1a" opacity=".55">React · Cropper.js</text>
    <rect x="286" y="182" width="126" height="86" rx="6" fill="#17110e"/>
    <rect x="300" y="196" width="98" height="58" fill="none" stroke="#fff" stroke-width="1.5"/>
    <g fill="#fff" stroke="#e5251f" stroke-width="1"><rect x="295" y="191" width="9" height="9"/><rect x="393" y="191" width="9" height="9"/><rect x="295" y="249" width="9" height="9"/><rect x="393" y="249" width="9" height="9"/></g>
    <text x="349" y="292" text-anchor="middle" font-size="11" fill="#1a1a1a" opacity=".6">recorte · zoom · girar</text>
  </g>

  <line x1="450" y1="215" x2="500" y2="215" stroke="#e5251f" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="475" y="205" text-anchor="middle" font-size="11" fill="#1a1a1a" opacity=".6">export()</text>

  <g>
    <rect x="508" y="150" width="150" height="130" rx="12" fill="#1a1a1a"/>
    <text x="583" y="208" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">Sharp</text>
    <text x="583" y="228" text-anchor="middle" font-size="11" fill="#fff" opacity=".6">Node · WebP</text>
  </g>

  <line x1="666" y1="215" x2="716" y2="215" stroke="#e5251f" stroke-width="2.5" marker-end="url(#ar)"/>

  <g>
    <rect x="724" y="128" width="196" height="54" rx="10" fill="#fff" stroke="#00000018"/>
    <text x="740" y="152" font-size="13" font-weight="500" fill="#1a1a1a">full · 1600px</text>
    <text x="740" y="170" font-size="11" fill="#1a1a1a" opacity=".55">WebP otimizado</text>
    <rect x="884" y="140" width="28" height="30" rx="4" fill="#17110e"/>

    <rect x="724" y="190" width="196" height="54" rx="10" fill="#fff" stroke="#00000018"/>
    <text x="740" y="214" font-size="13" font-weight="500" fill="#1a1a1a">thumb · 500px</text>
    <text x="740" y="232" font-size="11" fill="#1a1a1a" opacity=".55">WebP otimizado</text>
    <rect x="890" y="200" width="22" height="24" rx="4" fill="#17110e"/>

    <rect x="724" y="252" width="196" height="44" rx="10" fill="#eef3de" stroke="#63991244"/>
    <text x="740" y="279" font-size="12" fill="#3b6d11">+ variantes configuráveis</text>
  </g>

  <text x="920" y="402" text-anchor="end" font-size="12" fill="#1a1a1a" opacity=".4">Cropsmith © Eric Ferraz</text>
</svg>
